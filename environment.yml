# conda env create -f environment.yml && conda activate lpf-toolkit
#
# Rosetta is NOT here: supply a rosetta_scripts binary, or install PyRosetta
# into this environment afterwards (see the README). It is licensed separately.
name: lpf-toolkit
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.19
  - scipy>=1.6
  - matplotlib>=3.5
  - rdkit>=2022.9
  - scikit-learn>=1.0
  - py3dmol
  - nbformat
  - jupyterlab
  - gzip        # LigandPathFinder shells out to it after every Rosetta call
  - zip         # only when output.archive is on
  - pip
  - pip:
      - pyrosetta-installer   # then run its install_pyrosetta(), see the README
